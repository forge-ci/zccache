[stack.perf]
dockerfile = "ci/docker/profile/Dockerfile.bosn-perf-linux"
family = "zccache-perf"
default = true
workdir = "/work"

[stack.perf.env]
CARGO_TARGET_DIR = "/target"
RUSTFLAGS = "-C force-frame-pointers=yes -C debuginfo=2"
ZCCACHE_PROFILE_WORKLOAD = "perf_rustc_zccache_vs_sccache"

[stack.perf.volumes]
target = { scope = "stack", destination = "/target" }
soldr-home = { scope = "machine", destination = "/root/.soldr" }
soldr-cargo-home = { scope = "machine", destination = "/zccache-profile/cargo" }
soldr-rustup-home = { scope = "machine", destination = "/zccache-profile/rustup" }

[stack.perf.mounts]
repo = { source = ".", destination = "/work" }

[task.build-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh build"

[task.bench-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh bench"

[task.oncpu-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh oncpu"

[task.offcpu-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh offcpu"

[task.memory-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh memory"

[task.heaptrack-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh heaptrack"

[task.massif-profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh massif"

[task.profile]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_profile.sh all"

[task.lint]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_check.sh lint"

[task.test]
stack = "perf"
cmd = "bash /work/ci/docker/profile/run_bosn_check.sh test"

# Local GitHub Actions runs with nektos/act (see ci/docker/act/README.md).
# act drives the host Docker engine through the socket bind below; its job
# containers are siblings outside bosn's label contract, so the runner script
# labels and removes the ones it creates.
[stack.act]
dockerfile = "ci/docker/act/Dockerfile.bosn-act"
family = "zccache-act"
workdir = "/work"

[stack.act.volumes]
act-cache = { scope = "machine", destination = "/root/.cache" }

[stack.act.mounts]
repo = { source = ".", destination = "/work" }
docker-sock = { source = "/var/run/docker.sock", destination = "/var/run/docker.sock" }

[task.act-test-action]
stack = "act"
cmd = "bash /work/ci/docker/act/run_act_test_action.sh"

# The local gate's isolated `tests` lane (local-gate.toml; zackees/ci.yml#168
# GATE-005, #196 GATE-009). zccache's tests start zccache daemons, so they
# never run on the developer host, whose live zccache serves every soldr
# build. The image sets ZCCACHE_TEST_ISOLATED=1, the marker the nextest
# isolation guard (ci/nextest_isolation_guard.sh) accepts in place of CI=true.
[stack.gate]
dockerfile = "ci/docker/gate/Dockerfile"
family = "zccache-gate"
workdir = "/work"

[stack.gate.volumes]
gate-target = { scope = "stack", destination = "/target" }
# Per worktree, not per machine: bosn keeps each worktree's container warm,
# and a soldr broker left in one container holds the soldr root, so a
# second worktree's container sharing it failed every compile ("daemon
# exited mid-request"; on the host the same race reads "soldr root
# ownership is busy").
gate-soldr-home = { scope = "stack", destination = "/home/gate/.soldr" }

[stack.gate.mounts]
repo = { source = ".", destination = "/work" }

[task.gate-test]
stack = "gate"
cmd = "bash ci/docker/gate/run_gate_tests.sh"

[task.durable-payload-test]
stack = "gate"
cmd = "CARGO_TARGET_DIR=/target soldr cargo test -p zccache-daemon-core --features test-support --lib cached_artifact --locked -- --nocapture && CARGO_TARGET_DIR=/target soldr cargo test -p zccache-daemon-core --features test-support --lib handle_exec::tests --locked -- --nocapture"

[task.sysroot-search-test]
stack = "gate"
cmd = "CARGO_TARGET_DIR=/target/1930-uncached soldr --trust-inherited-soldr-env --no-cache cargo test -p zccache-compiler --lib library_search --locked && CARGO_TARGET_DIR=/target/1930-uncached soldr --trust-inherited-soldr-env --no-cache cargo test -p zccache-daemon-core --features test-support --lib rustc:: --locked && CARGO_TARGET_DIR=/target/1930-uncached soldr --trust-inherited-soldr-env --no-cache cargo test -p zccache --features test-support --test cache_rust library_search --locked -- --test-threads=1 --show-output"

[task.perf-2174-unit]
stack = "gate"
cmd = "CARGO_TARGET_DIR=/target/1930-uncached soldr --trust-inherited-soldr-env --no-cache cargo test -p zccache-daemon-core --features test-support --lib rustc::library_inputs::tests::perf_ --locked -- --nocapture"

[task.sysroot-search-repro]
stack = "gate"
cmd = "CARGO_TARGET_DIR=/target soldr cargo test -p zccache --features test-support --test cache_rust library_search --locked -- --test-threads=1"

# Focused backend transport checks use the existing isolated gate stack.
[task.compiler-snapshot-test]
stack = "gate"
cmd = "soldr toolchain ensure --json && soldr rustup component add clippy && ZCCACHE_LEGACY_PATH_VALIDATE=1 CARGO_TARGET_DIR=/target soldr cargo test -p zccache-artifact --lib --locked && CARGO_TARGET_DIR=/target soldr cargo test -p zccache-daemon-core --features test-support --lib cache_root_writer_tests --locked && CARGO_TARGET_DIR=/target soldr cargo test -p zccache-cli-core --features cli --lib compiler_snapshot --locked && CARGO_TARGET_DIR=/target soldr cargo clippy -p zccache-artifact -p zccache-core --all-targets --locked -- -D warnings && CARGO_TARGET_DIR=/target soldr cargo clippy -p zccache-cli-core --features cli --all-targets --locked -- -D warnings"

