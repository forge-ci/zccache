[package]
name = "enforce_platform_boundary"
version = "0.2.0"
description = "Confine host-platform selection and native APIs to approved zccache adapters"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Match the dylint_linting pin used by the sibling dylints — same toolchain
# (rust-toolchain.toml here), same upstream commit.
dylint_linting = "=6.2.0"

[dev-dependencies]
dylint_testing = "=6.2.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
