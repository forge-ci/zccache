name: Windows

on:
  workflow_dispatch:
  schedule:
    - cron: "18 7 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  # pull_request deliberately absent: expensive lane deferred to main push,
  # nightly schedule and workflow_dispatch (PR queue is Linux-only; CI summary gate).

permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  x86:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: windows-latest
      run_check: false

  arm:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: windows-11-arm
      run_check: false

  # Push/schedule-only gate (too slow for the merge queue): report a red main
  # to a `main-red` tracking issue instead of reddening it silently.
  main-red-notify:
    name: Main red notifier
    needs: [cache-pre-prune, x86, arm]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ci
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Report main status
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 python -m ci.main_red_notify
