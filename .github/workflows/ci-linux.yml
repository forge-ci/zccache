name: Linux

on:
  # Manual full run (includes native arm64); see the `arm` job.
  workflow_dispatch:
    inputs:
      forge_pool:
        description: "RUN-005 canary: use the forge pool even while FORGE_POOL_LABELS is unset"
        type: boolean
        default: false
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ci-linux-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # GEN-021 verified reuse, SHADOW mode only (zackees/ci.yml#162). It records
  # whether this main push's tree is byte-identical to a PR head whose Linux
  # CI passed the jobs listed below, in the job summary. Observation only:
  # nothing needs this job, `--mode shadow` always reports reuse=false, and
  # continue-on-error keeps any failure here from turning the run red.
  # Required jobs: green on both recent PR and main-push runs; the cache
  # pre-prune barrier is main-push cache plumbing, not validation, so it is
  # deliberately not a proof requirement.
  reuse-shadow:
    name: Verified reuse decision (shadow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out ci-lint (zackees/ci.yml, pinned)
        uses: actions/checkout@v6
        with:
          repository: zackees/ci.yml
          ref: 635fb1262b59702b9293a145e7201410612104e5
          path: .ci-lint
          persist-credentials: false
      - name: Verified reuse decision (GEN-021, shadow)
        working-directory: .ci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m ci_lint reuse-check --workflow ci.yml --mode shadow
          --max-age-hours 24
          --required-job "Linux / x86 / Check"
          --required-job "Linux / x86 / Test"
          --required-job "Linux / x86-musl / Check (linux-x86-musl)"
          --required-job "Linux / arm-musl / Check (linux-arm-musl)"

  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  # Forge pool (forge-ci/gh-runner docs/pool.md): picks the self-hosted Dell
  # pool for the x86 Check/Test jobs when the repo variable FORGE_POOL_LABELS
  # is set and the pool has an idle runner, else hosted. pool-select keeps
  # fork PRs and pull_request_target hosted (trusted-only, the default).
  # Unset FORGE_POOL_LABELS to send every job back to hosted at once.
  pool:
    name: Select runner
    # Skipped while routing is off: the job below then runs hosted.
    if: vars.FORGE_POOL_LABELS != '' || inputs.forge_pool
    # forge-quick through the kill switch (RUN-004).
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on || '"ubuntu-latest"' }}
    steps:
      - name: Select pool or hosted
        id: select
        continue-on-error: true
        uses: forge-ci/ci.yml/actions/pool-select@a36bc81ad6ada5fb17398e3e7ba38435cc67a951 # ci.yml#550, tokenless signal source
        with:
          # The variable is the kill switch; a manual `forge_pool` dispatch
          # proves one real job on the pool before the variable is set.
          labels: ${{ vars.FORGE_POOL_LABELS || (inputs.forge_pool && '["self-hosted","forge-pool"]' || '') }}
          fallback: ubuntu-latest

  x86:
    needs: [cache-pre-prune, pool]
    # Runs when the selector was skipped (routing off) or failed, too: an
    # empty runner input means hosted `os`.
    if: ${{ !cancelled() && needs.cache-pre-prune.result == 'success' }}
    uses: ./.github/workflows/ci-check.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: ubuntu-latest
      # The pool's runs-on JSON, or "ubuntu-latest"; `os` keeps naming the
      # lane (cache keys and Linux-only steps read it).
      runner: ${{ needs.pool.outputs.runs-on }}

  arm:
    needs: cache-pre-prune
    # Native arm64 is off the PR and main-push paths: its cook/registry/build
    # caches were ~1 GB of the repo's 10 GB on main. It runs only on a manual
    # dispatch (ci-full equivalent), which never saves caches (save-cache is
    # main-push-only). The arm64 musl cross check below still runs on every
    # PR and push (cheap, compiles the aarch64 target from the x64 runner).
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-check.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: ubuntu-24.04-arm

  x86-musl:
    needs: cache-pre-prune
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: ./.github/workflows/ci-check-cross.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: ubuntu-latest
      target: x86_64-unknown-linux-musl
      label: linux-x86-musl

  arm-musl:
    needs: cache-pre-prune
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: ./.github/workflows/ci-check-cross.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      # setup-soldr's aarch64-musl cross compiler is an x86_64 host tool.
      # Native ARM coverage remains in the separate arm job above.
      os: ubuntu-latest
      target: aarch64-unknown-linux-musl
      label: linux-arm-musl
