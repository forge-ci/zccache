name: Clippy

# Reusable: called by ci.yml so Clippy runs on pull_request, merge_group and
# main pushes, and its job is part of the run attempt `CI summary` reads.
# It used to trigger only on push to main, so clippy errors merged unseen and
# turned main red (run 42482218220). Caller owns concurrency and the
# cache pre-prune barrier (`needs: cache-pre-prune`).
on:
  workflow_call:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Feature set that makes `--all-targets` compile the feature-gated
  # integration tests (`zccache::ci`, `zccache::cli`, `zccache::symbols`,
  # the `zip`/download installer test, …). Kept in sync with
  # `integration.yml`'s ZCCACHE_INTEGRATION_FEATURES — without it,
  # `clippy --workspace --all-targets` fails to compile those tests with
  # `unresolved import` (the long-standing red Clippy job).
  ZCCACHE_CLIPPY_FEATURES: "zccache/zccache-bin,zccache/daemon-bin,zccache/download-bin,zccache/download-daemon-bin,zccache/fingerprint-bin,zccache/stamp-bin,zccache/ci-bin,zccache/crash-tools,zccache/tokio-console,zccache/test-support,zccache/heap-profile"
  # The workspace [lints.clippy] block in Cargo.toml denies the panic-class
  # lints (unwrap_used / unwrap_in_result / panic_in_result_fn / expect_used).
  # These error on their own; this workflow leaves unrelated warnings at
  # their configured levels. Other workflows keep -D warnings.

jobs:
  clippy:
    env: # setup-soldr#629: S3 remote build cache credentials
      SOLDR_S3_CACHE_ACCESS_KEY: ${{ secrets.SOLDR_S3_CACHE_ACCESS_KEY }}
      SOLDR_S3_CACHE_SECRET_KEY: ${{ secrets.SOLDR_S3_CACHE_SECRET_KEY }}
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune
      - uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          s3-bucket: forge-ci-cache # setup-soldr#629 S3 remote build cache
          s3-endpoint: sfo3.digitaloceanspaces.com
          job-status: ${{ job.status }} # setup-soldr#559: a failed job saves no build outputs
          cook-delta: false # per-commit delta layer off (setup-soldr#528)
          # Global auto keeps local saves warm; the remote permission preserves
          # the #1677 current-main pre-prune guard (setup-soldr#565).
          save-cache: auto
          save-cache-remote: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ZCCACHE_CACHE_WRITES == 'true' && 'auto' || 'false' }}
          zccache-seed-strict: true
          toolchain: 1.95.0
          cache: true
          linker: fast
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""
          verify-compile-cache: warn
          # #1677: standalone toolchain snapshots are disabled repo-wide.
          solo-toolchain-cache: false # #1677 retires the standalone toolchain archive.
      - name: Install Clippy
        run: soldr rustup component add clippy
      - name: Run Clippy
        run: soldr cargo clippy --workspace --all-targets --features "$ZCCACHE_CLIPPY_FEATURES" -- -D warnings
