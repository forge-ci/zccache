name: macOS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "NOTICE*"
      - "AUTHORS*"
      - "CODEOWNERS"
      - "CONTRIBUTING*"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "tasks/**"
  # pull_request deliberately absent: expensive lane deferred to main push,
  # nightly schedule and workflow_dispatch (PR queue is Linux-only; CI summary gate).

# Superseded PR runs used to keep holding macOS slots while a fresh run
# queued behind them. Against GitHub's 5-concurrent-job macOS cap that is
# what produced the 16 -> 32 -> 49 -> 59 minute queue staircase. Pushes to
# main are never cancelled: auto-release.yml triggers on push-to-main
# version bumps, so every commit that lands must be fully tested.
permissions:
  actions: read
  contents: read

concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  # macos-15 is Apple Silicon. This was previously two jobs, `x86` and `arm`,
  # both pinned to the same arm64 image, byte-identical duplicates that also derived the
  # same cache-key-suffix and so raced each other on cache save. Real Intel
  # coverage would mean macos-13, which is deliberately avoided: see
  # wrapper-e2e.yml, where that pool cost 15+ minutes of queue wait per run.
  macos:
    needs: cache-pre-prune
    uses: ./.github/workflows/ci-check.yml
    secrets: inherit # SOLDR_S3_CACHE_* for setup-soldr's S3 build cache
    with:
      os: macos-15
      run_check: false

  observe-macos-queue:
    name: Observe macOS runner queue
    # Start the queue budget only when the watched jobs become eligible.
    needs: cache-pre-prune
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Bound macOS queue starvation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python ci/observe_runner_queue.py
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --runner macos-15 --job "macos / Test" --token "$GITHUB_TOKEN"

  # Push/schedule-only gate (too slow for the merge queue): report a red main
  # to a `main-red` tracking issue instead of reddening it silently.
  main-red-notify:
    name: Main red notifier
    needs: [cache-pre-prune, macos, observe-macos-queue]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ci
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Report main status
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 python -m ci.main_red_notify
