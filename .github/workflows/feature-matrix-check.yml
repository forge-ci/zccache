name: Feature Matrix Check

# Called by CI so stale rendered outputs fail the single required aggregate,
# including on docs-only PRs and merge-group commits.
#
# Re-run locally with:
#   uv run --with pyyaml python ci/render_feature_matrix.py

on:
  push:
    branches: [main]
    paths:
      - "docs/feature-matrix.yaml"
      - "docs/FEATURE-MATRIX.md"
      - "ci/render_feature_matrix.py"
      - "README.md"
      - ".github/workflows/feature-matrix-check.yml"
  workflow_call:

# Auto-cancel superseded PR runs: pushing again to a feature branch
# supersedes the in-flight run instead of queueing behind it. Non-PR events
# key on run_id so each gets its own group -- GitHub keeps only ONE pending
# run per group, so a shared group silently drops queued main-push SHAs.
permissions:
  actions: read
  contents: read

concurrency:
  group: feature-matrix-check-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cache-pre-prune:
    name: Cache pre-prune barrier
    uses: ./.github/workflows/wait-cache-pre-prune.yml
    permissions:
      actions: read
      contents: read

  check:
    needs: cache-pre-prune
    name: Feature matrix is rendered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Wait for current-main cache pre-prune
        uses: ./.github/actions/wait-cache-pre-prune

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify rendered outputs match YAML source of truth
        run: uv run --with pyyaml python ci/render_feature_matrix.py --check
